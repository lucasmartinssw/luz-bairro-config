apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# lucasrmartins-dev: troque cicd-dev pelo seu projeto de desenvolvimento ($DEV_NS) aqui e em "newName".
namespace: lucasrmartins-dev

resources:
  - ../../base

# As linhas "newName", "digest" e "APP_VERSION" sao reescritas pelo pipeline (task update-config).
# Nao altere o formato delas: o pipeline as localiza por padrao de texto.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/lucasrmartins-dev/luz-bairro
    digest: sha256:6cda05868f4104328bf60c993aab0bfee683734c23645a7f03900fba4f7edce1

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_VERSION=fbd3328
