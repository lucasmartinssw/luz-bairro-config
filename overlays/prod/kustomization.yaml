apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# lucasrmartins-dev: troque lucasrmartins-prod pelo seu projeto de producao ($PROD_NS).
namespace: lucasrmartins-prod

resources:
  - ../../base

# Producao NAO e construida: usa a MESMA imagem de dev, identificada pelo digest.
# O digest (e APP_VERSION) so mudam por pull request de promocao (config/scripts/promover.sh).
# lucasrmartins-dev: em newName, troque cicd-dev pelo seu projeto de DESENVOLVIMENTO ($DEV_NS),
# porque e la que o pipeline publica a imagem.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/lucasrmartins-dev/luz-bairro
    digest: sha256:6cda05868f4104328bf60c993aab0bfee683734c23645a7f03900fba4f7edce1

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - PRODUCAO
      - APP_ENV=prod
      - APP_VERSION=e305108

patches:
  - target:
      kind: Deployment
      name: luz-bairro
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
